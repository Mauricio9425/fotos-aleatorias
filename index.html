<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body{
    margin:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    cursor:pointer;
}

img{
    max-width:100%;
    max-height:100%;
}
</style>

</head>

<body>

<img id="foto">

<script>

const fotos = [
"foto1.png",
"foto2.png",
"foto3.png",
"foto4.png",
"foto5.png",
"foto6.png",
"foto7.png",
"foto8.png",
"foto9.png",
"foto10.png",
"foto11.png",
"foto12.png",
"foto13.png",
"foto14.png",
"foto15.png",
"foto16.png"
];

function mostrarFoto() {

    const indice = Math.floor(Math.random() * fotos.length);

    document.getElementById("foto").src = fotos[indice];
}

document.body.addEventListener("click", mostrarFoto);

mostrarFoto();

</script>

</body>
</html>
